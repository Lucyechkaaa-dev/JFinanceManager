spring:
  application:
    name: jfinance-manager
  datasource:
    # WAL + busy timeout + FK enforcement are applied per connection by sqlite-jdbc.
    url: jdbc:sqlite:${JFINANCE_DB_PATH:jfinance.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows a single writer. One pooled connection serialises all database work,
      # which removes SQLITE_BUSY errors and write races by design (KISS for a single-node app).
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      timeout: 15m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-stacktrace: never

jfinance:
  admin:
    # First administrator is created only when the users table is empty.
    username: ${JFINANCE_ADMIN_USERNAME:admin}
    password: ${JFINANCE_ADMIN_PASSWORD:}
  security:
    max-failed-attempts: 5
    lock-duration: 15m
  currencies:
    base: UAH
    supported: UAH, USD, EUR, GBP, PLN
  nbu:
    url: https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json
    cache-ttl: 1h

logging:
  file:
    name: logs/jfinance.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{username:-anonymous}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] [%X{username:-anonymous}] %logger{50} - %msg%n"
  level:
    io.github.lucyechkaaa.jfinance: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
